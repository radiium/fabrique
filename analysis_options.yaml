include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    # Code généré : ni relu ni corrigé à la main, il n'a pas à passer ces règles.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Immuabilité
    - prefer_final_locals
    - prefer_final_fields
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Asynchrone : aucune Future oubliée
    - unawaited_futures
    - discarded_futures

    # Types
    - avoid_dynamic_calls
    - always_declare_return_types
    - omit_local_variable_types
    - cast_nullable_to_non_nullable

    # Forme
    - directives_ordering
    - prefer_relative_imports
    - use_super_parameters
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - sort_constructors_first
    - avoid_returning_null_for_void

    # Écartée volontairement : avoid_redundant_argument_values. Une valeur par
    # défaut écrite en toutes lettres sert souvent à la lecture
    # (`brightness: Brightness.light`, la combinaison testée dans un test).
